<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="title"></title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=">
  <link rel="stylesheet" href="setup.css">
  <script src="vendor/leaflet/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" defer></script>
  <script type="module" src="setup.js"></script>
</head>
<body>
  <main>
    <h1 data-i18n="appName"></h1>
    <p id="status" role="status"></p>

    <section id="list" hidden>
      <h2 class="title" data-i18n="profiles"></h2>
      <p class="hint" data-i18n="profilesHint"></p>
      <ol id="profiles"></ol>
      <button type="button" id="add" data-i18n="addProfile"></button>
      <button type="button" id="unpair" class="danger" hidden data-i18n="unpair"></button>

      <form id="save" class="bar">
        <input name="username" autocomplete="username" value="train-status" hidden>
        <label id="password" class="field" hidden><span data-i18n="ownerPassword"></span>
          <input type="password" id="password-input" autocomplete="current-password">
        </label>
        <button type="submit" class="primary" data-i18n="saveToWatch"></button>
      </form>
    </section>

    <form id="editor" hidden>
      <div class="section">
        <label class="title" for="name" data-i18n="name"></label>
        <div class="panel">
          <input id="name" maxlength="40" required data-i18n-placeholder="namePlaceholder">
        </div>
      </div>

      <fieldset class="section">
        <legend class="title" data-i18n="zone"></legend>
        <div class="panel">
          <p class="hint" data-i18n="zoneHint"></p>
          <div id="map"></div>
          <label class="field"><span><span data-i18n="radius"></span> <output id="radius-value"></output></span>
            <input type="range" id="radius" min="0" max="100">
          </label>
          <button type="button" id="locate" data-i18n="myLocation"></button>
        </div>
      </fieldset>

      <fieldset class="section picker" data-field="from" data-max="3">
        <legend class="title" data-i18n="fromStations"></legend>
        <div class="panel">
          <ul class="chips"></ul>
          <input type="search" autocomplete="off">
          <ul class="results"></ul>
        </div>
      </fieldset>

      <fieldset class="section picker" data-field="to" data-max="10">
        <legend class="title" data-i18n="toStations"></legend>
        <div class="panel">
          <ul class="chips"></ul>
          <input type="search" autocomplete="off">
          <ul class="results"></ul>
        </div>
      </fieldset>

      <p id="editor-error" class="error" role="alert"></p>
      <button type="button" id="delete" class="danger" data-i18n="deleteProfile"></button>
      <div class="bar actions">
        <button type="button" id="cancel" data-i18n="cancel"></button>
        <button type="submit" class="primary" data-i18n="done"></button>
      </div>
    </form>
  </main>
</body>
</html>
